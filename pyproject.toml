[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "preregister"
version = "0.1.0"
description = "Pre-registration for ML experiments: admissibility gates, hash-chained predictions, run linking, and reconciliation reports."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniel De Brun" }]
requires-python = ">=3.10"
keywords = ["pre-registration", "reproducibility", "machine learning", "experiment tracking", "statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23", "pyyaml>=6.0"]

[project.optional-dependencies]
wandb = ["wandb>=0.15"]
mlflow = ["mlflow>=2.0"]
dev = ["pytest>=7.4", "ruff>=0.5", "scipy>=1.10"]

[project.scripts]
preregister = "preregister.cli:main"

[project.urls]
Repository = "https://github.com/daniel-debrun/preregister"

[tool.hatch.build.targets.wheel]
packages = ["src/preregister"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF012"]  # line length is enforced by `ruff format`
